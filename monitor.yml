name: Tesla Inventory Monitor

on:
  schedule:
    # Every 5 minutes. GitHub may delay this somewhat under load; that's fine.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

# Needed so the workflow can commit the updated "seen VINs" state file back.
permissions:
  contents: write

concurrency:
  group: tesla-monitor
  cancel-in-progress: false

jobs:
  check-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run inventory check
        env:
          ZIP: ${{ vars.ZIP }}
          RANGE_MILES: ${{ vars.RANGE_MILES }}
          MODEL: ${{ vars.MODEL }}
          CONDITION: ${{ vars.CONDITION }}
          TRIM_KEYWORDS: ${{ vars.TRIM_KEYWORDS }}
          REQUIRE_RWD: ${{ vars.REQUIRE_RWD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: python3 tesla_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "tesla-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_vehicles.json monitor.log
          git diff --staged --quiet || git commit -m "Update monitor state [skip ci]"
          git push
